# Zuhause – nur für einen Start von Hand (docker compose up -d --build).
# Normal läuft Zuhause über die Deploy-Automatik: Test bei jedem Push, Produktiv nach Freigabe.
services:
  zuhause:
    build: .
    container_name: zuhause
    restart: unless-stopped
    ports:
      - "8034:8080"
    environment:
      OPENHAB_URL: "http://192.168.131.14:8080"
      OPENHAB_TOKEN: "oh.zuhause.xxxxxxxx"
      ADMIN_BENUTZER: "Matthias"
      ADMIN_PASSWORT: "bitte-aendern"
    volumes:
      - daten:/daten
volumes:
  daten:
    name: zuhause
